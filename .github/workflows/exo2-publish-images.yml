# Construit les images du portail depot (exo2) et les publie sur GHCR.
#
# A6 : la machine de staging ne doit contenir aucun code source. C'est donc ici
# que la construction a lieu, une fois, et la machine se contente de tirer.
#
# Le depot heberge plusieurs exercices : d'ou le prefixe `exo2-` sur le nom du
# workflow, sur le tag git declencheur et sur celui des images.
name: exo2 — publier les images

on:
  push:
    # Un tag `exo2-v1.2.3` publie une version : c'est le seul evenement qui
    # produit un tag d'image semver, donc le seul que la production epingle.
    tags: ['exo2-v*']
    # Un push sur main publie `edge` et `sha-<court>`. Le second est ce qui
    # permet de faire tourner l'ARTEFACT REEL avant de poser un tag de version
    # (build, release, run) : on promeut une image qu'on a vue tourner, on n'en
    # reconstruit pas une autre.
    branches: [main]
    # Pas de filtre `paths`, et c'est deliberé : GitHub combine les filtres d'un
    # meme evenement par ET, y compris avec `tags`. Un tag `exo2-v0.1.0` pose sur
    # un commit qui ne touche ni backend/ ni frontend/ — le cas normal, une
    # release suivant une fusion de documentation — ne publierait alors RIEN, en
    # silence. Le cout d'y renoncer est faible : le cache GHA rend un rebuild
    # sans changement de source quasi gratuit, et cela garantit qu'un tag
    # `sha-<court>` existe pour n'importe quel commit de main, donc que
    # IMAGE_TAG=sha-... marche toujours.
  # Republier sans commit (image supprimee, cache casse, changement de registre).
  workflow_dispatch:

# Deliberement AUCUN declencheur `pull_request` : un PR issu d'un fork ne doit
# jamais pouvoir atteindre le registre.

# Portee minimale par defaut ; le job la releve pour lui seul.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # C'est ce droit qui fait fabriquer par GitHub un GITHUB_TOKEN capable
      # d'ecrire sur GHCR. Aucun PAT n'existe, ni ici ni sur la machine de prod.
      packages: write
    strategy:
      # Les deux images sont independantes : une seule qui echoue ne doit pas
      # annuler l'autre, on veut savoir laquelle est cassee.
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: exo2-portail-depot/backend
          - app: frontend
            context: exo2-portail-depot/frontend

    steps:
      # Actions epinglees au SHA de commit, version en commentaire : c'est la
      # recommandation de durcissement de GitHub. Un tag `@v7` est mutable, et
      # ce job dispose de `packages: write` — la compromission d'un tag amont
      # donnerait un acces en ecriture au registre.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # buildx : necessaire au cache GitHub Actions (type=gha) et aux
      # attestations de provenance.
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authentification GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer tags et labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/exo2-portail-depot-${{ matrix.app }}
          # `github.repository_owner` et non `github.repository` : le depot
          # s'appelle technical-interview et heberge plusieurs exercices, le nom
          # d'image porte donc l'exercice.
          tags: |
            type=match,pattern=exo2-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=exo2-v(\d+\.\d+),group=1
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
          # Sans `image.source`, le paquet GHCR n'est pas rattache au depot :
          # il s'affiche sans source ni licence, et la page Packages du depot
          # ne le montre pas.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Portail de depot de pieces (exo2) — ${{ matrix.app }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Construire et publier
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Le contexte est le repertoire de l'application, comme en local :
          # chaque Dockerfile construit depuis son propre dossier, avec son
          # propre .dockerignore, et les chemins qu'il contient sont non prefixes.
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 seul : la machine de staging l'est, et emuler arm64 sous QEMU
          # pour compiler la dependance native argon2 ferait passer ce job de
          # ~3 min a ~15 min pour une plateforme que personne ne deploie.
          platforms: linux/amd64
          # Les deux `pnpm install` sont l'essentiel du temps de build ; le
          # cache GitHub Actions les evite d'un run a l'autre. mode=max met en
          # cache les couches intermediaires, pas seulement l'image finale.
          cache-from: type=gha,scope=exo2-${{ matrix.app }}
          cache-to: type=gha,scope=exo2-${{ matrix.app }},mode=max
          # Attestation SLSA : dit quel workflow, quel commit et quelle source
          # ont produit l'image.
          provenance: true
