# pnpm 11 : les scripts de build sont opt-in. Sans cette liste,
# `pnpm install --frozen-lockfile` sort en 1 sur ERR_PNPM_IGNORED_BUILDS,
# y compris dans le Dockerfile (qui COPY ce fichier avec le lockfile).
allowBuilds:
  # Telecharge le moteur de requete Prisma. Sans lui : « Query engine binary
  # not found » au premier appel, pas au demarrage.
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
