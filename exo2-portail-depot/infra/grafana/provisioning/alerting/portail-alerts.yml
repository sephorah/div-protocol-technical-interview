# Les quatre alertes du portail, PROVISIONNEES : une alerte creee dans
# l'interface vit dans le volume grafana_data, et une alerte disparue ne se
# signale jamais.
#
# Les seuils, leur justification et le geste a faire quand une alerte part sont
# dans docs/observabilite.md, qui sert de runbook. AUCUN POINT DE CONTACT n'est
# configure : les alertes sont visibles, elles ne sont pas poussees.

apiVersion: 1

groups:
  - orgId: 1
    name: portail
    folder: Portail
    # DOIT etre un multiple de 10 s, la periode de base de l'ordonnanceur : un
    # 15 s — la valeur naturelle, celle du scrape — fait echouer TOUT le
    # provisionnement et le conteneur sort en erreur.
    interval: 30s
    rules:
      # 1. API injoignable — up < 1 pendant 1 min, soit quatre scrapes rates.
      - uid: portail-api-down
        title: API injoignable
        condition: C
        for: 1m
        # Pas de donnee = la cible a disparu, ce qui EST la panne surveillee.
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severite: critique
        annotations:
          summary: "L'API du portail ne repond plus aux scrapes Prometheus."
          description: >-
            Aucun depot ni aucune connexion avocat n'est possible.
            Verifier : docker compose -f infra/docker-compose.yml --env-file .env logs backend
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: portail-prometheus
            model:
              refId: A
              expr: up{job="portal-backend"}
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # 2. Taux d'echec de depot > 10 % sur 5 min, avec un plancher de 5 depots
      # — le piege a ne pas rouvrir : sans lui, un seul fichier refuse sur trois
      # donne 33 %, donc une alerte critique pour un client maladroit.
      - uid: portail-deposit-failure-rate
        title: Taux d'echec de depot superieur a 10 %
        condition: C
        # Exige que le taux se MAINTIENNE, donc qu'il ne s'agisse pas d'une rafale.
        for: 5m
        # Aucun depot dans la fenetre n'est pas un incident : c'est la nuit.
        noDataState: OK
        execErrState: Alerting
        labels:
          severite: majeure
        annotations:
          summary: 'Plus de 10 % des depots echouent sur les 5 dernieres minutes.'
          description: >-
            Repartir les echecs par outcome (rejected_type, rejected_size, error)
            sur le tableau de bord Portail. `error` en tete pointe le stockage,
            `rejected_type` pointe l'interface qui laisse choisir un format refuse.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: portail-prometheus
            model:
              refId: A
              expr: >-
                (
                  sum(rate(portal_deposits_total{outcome!="success"}[5m]))
                  /
                  sum(rate(portal_deposits_total[5m]))
                )
                and
                (sum(increase(portal_deposits_total[5m])) >= 5)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]

      # 3. Force brute sur le PIN — 20 echecs en 5 min. C'est ce qui REMPLACE la
      # limitation de debit, coupee du perimetre : elle DETECTE, elle n'empeche
      # pas. increase() et non rate() : le seuil est un nombre, pas une frequence.
      - uid: portail-pin-brute-force
        title: Force brute sur le PIN d'un lien de depot
        condition: C
        # 0 s : la fenetre de 5 min lisse deja le bruit, et attendre en plus
        # retarderait la seule detection qui existe.
        for: 0s
        # Aucune tentative n'est pas une attaque.
        noDataState: OK
        execErrState: Alerting
        labels:
          severite: securite
        annotations:
          summary: 'Plus de 20 codes PIN refuses en 5 minutes.'
          description: >-
            Signature d'une attaque par force brute sur les 10 000 combinaisons
            d'un PIN a 4 chiffres. Le portail n'a PAS de limitation de debit
            (G1 hors perimetre) : la reponse est manuelle — revoquer le lien
            concerne avec DELETE /api/v1/requests/:id/link, puis le regenerer.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: portail-prometheus
            model:
              refId: A
              expr: sum(increase(portal_unlock_attempts_total{outcome="failure"}[5m]))
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]

      # 4. Dependance injoignable — une seule reponse 503 sur /health suffit.
      # Ce qui fait battre cette alerte est le healthcheck docker du backend :
      # le retirer du compose la rendrait silencieuse sans rien casser de
      # visible. Le `route=~` couvre les deux formes de l'etiquette — un
      # `route=` exact qui tombe a cote ne produirait AUCUNE erreur, l'alerte ne
      # partirait simplement jamais.
      - uid: portail-storage-down
        title: Dependance injoignable (MinIO ou Postgres)
        condition: C
        for: 1m
        # Pas de donnee = plus aucun scrape, ce que l'alerte 1 couvre deja.
        noDataState: OK
        execErrState: Alerting
        labels:
          severite: critique
        annotations:
          summary: 'La sonde de sante du backend repond 503.'
          description: >-
            MinIO ou Postgres ne repond plus. Tant que dure la panne, aucun
            depot n'aboutit. Lire le corps de la sonde pour savoir laquelle des
            deux dependances est en cause.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: portail-prometheus
            model:
              refId: A
              expr: >-
                sum(increase(portal_http_request_duration_seconds_count{route=~"(/api/v1)?/health",status="503"}[5m]))
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
