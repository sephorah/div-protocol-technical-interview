# Developpement : la base et le stockage objet.
#
# L'API et le front continuent de tourner sur la machine via `pnpm dev`, pour
# garder le rechargement a chaud. Il n'y a deliberement pas d'image de dev.
#
#   pnpm db:up      # docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
#   pnpm dev
#
# Les deux drapeaux sont necessaires et l'en-tete de docker-compose.yml dit
# pourquoi : le .env vit a la racine, compose le chercherait dans infra/.
#
# Le volume porte un nom distinct de celui de la production : une base de
# developpement et une base de production sur le meme volume, c'est un
# `migrate reset` de trop.
#
# Le nom de projet aussi, et c'etait le vrai trou : les deux fichiers compose
# etant a la racine, ils heritaient du MEME nom de projet. Un `pnpm db:up`
# pendant que la production tournait ne montait donc pas une seconde stack — il
# recreait db, minio et minio-init de la production avec cette configuration-ci,
# soit des volumes _dev vides et deux ports publies, pendant que le backend de
# production continuait de tourner contre eux.
name: exo2-portail-depot-dev

services:
  db:
    image: postgres:17-alpine
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:?definir DB_USER dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      POSTGRES_DB: ${DB_NAME:?definir DB_NAME dans .env}
    ports:
      # 127.0.0.1 explicitement, jamais 0.0.0.0 : la machine de staging est
      # partagee, et meme en local une base ouverte sur le reseau n'a aucune
      # raison d'exister. 21632 est dans la plage attribuee (21600-21699) ;
      # 5432 entrerait en collision avec un Postgres installe sur l'hote.
      - '127.0.0.1:21632:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    init: true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD dans .env}
    ports:
      # Meme regle que la base : 127.0.0.1 explicite, et dans la plage attribuee.
      # 21690 est l'API S3 (ce que vise STORAGE_ENDPOINT en dev), 21691 la
      # console web, utile pour verifier a l'oeil ce qu'un depot a ecrit.
      - '127.0.0.1:21690:9000'
      - '127.0.0.1:21691:9001'
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # Meme provisionnement qu'en production : `pnpm dev` fait tourner l'API avec
  # l'utilisateur restreint, pas avec le root. Un dev qui marcherait ici mais
  # pas en production a cause d'une permission manquante serait le pire des cas.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD dans .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?definir STORAGE_BUCKET dans .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?definir STORAGE_ACCESS_KEY dans .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?definir STORAGE_SECRET_KEY dans .env}
    volumes:
      - ./minio:/infra:ro
    entrypoint: ['/bin/bash', '/infra/provision.sh']
    restart: 'no'

volumes:
  pgdata_dev:
  minio_data_dev:
