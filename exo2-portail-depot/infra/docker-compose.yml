# Production. En dev, on lance `pnpm dev` a la racine, avec la base seule
# montee par docker-compose.dev.yml.
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#
# Depuis la RACINE du depot, et les deux drapeaux sont necessaires :
#
# - `--env-file .env` : compose cherche son .env dans le repertoire de projet,
#   qu'il deduit du dossier du premier `-f` — donc infra/ ici. Or le .env vit a
#   la racine, parce que `pnpm dev` fait tourner l'API sur la machine et que
#   app.module.ts l'y resout depuis __dirname. Sans ce drapeau, toutes les
#   variables sont manquantes et `${VAR:?}` fait echouer le demarrage.
# - `name:` ci-dessous : sans lui, le nom du projet serait « infra » (le dossier
#   du fichier), et tous les volumes existants deviendraient orphelins.
#
# Les chemins relatifs de ce fichier sont donc relatifs a infra/, pas a la
# racine. `pnpm stack:up` / `stack:down` / `stack:logs` evitent de la retaper.
#
# Depuis A6, ce fichier ne CONSTRUIT plus rien : backend et frontend sont tires
# de GHCR, ou le workflow .github/workflows/exo2-publish-images.yml les publie.
# Il ne reste ici que de la configuration (nginx.conf, minio/), donc infra/ et
# .env suffisent a faire tourner le portail — c'est le critere « aucun code
# source sur la machine ». Pour construire en local, il y a le calque
# docker-compose.build.yml, jamais charge sans un `-f` explicite.
#
# PORT et API_PREFIX viennent du .env et valent la meme chose ici que sur la
# machine : 21610 est dans la plage attribuee (21600-21699), donc rien
# n'oblige a une valeur differente en conteneur, et une valeur unique supprime
# une source d'erreur. Ils sont aussi ecrits en dur dans nginx.conf (qui ne lit
# pas l'environnement) et dans le healthcheck ci-dessous : les changer suppose
# de changer ces trois endroits ensemble.
#
# Nom fige, et non deduit du dossier : il l'etait, et changer de dossier de
# checkout — ce que fera la machine de production en A6 — aurait suffi a rendre
# invisibles les volumes de la stack precedente. Distinct de celui de
# docker-compose.dev.yml : les deux fichiers partageaient le meme, si bien qu'un
# `pnpm db:up` pendant que la production tourne recreait db et minio avec la
# configuration de dev (volumes vides, ports publies) sous le nez du backend.
name: exo2-portail-depot

services:
  db:
    image: postgres:17-alpine
    init: true
    # La forme `:?` fait echouer `docker compose up` en nommant la variable
    # manquante. Sans elle, une variable vide demarrerait un Postgres avec un
    # mot de passe vide, ce qui « marche » et est exactement le probleme.
    environment:
      POSTGRES_USER: ${DB_USER:?definir DB_USER dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      POSTGRES_DB: ${DB_NAME:?definir DB_NAME dans .env}
    volumes:
      # Volume nomme : `docker compose down` sans -v preserve les donnees.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` echappe l'interpolation compose : c'est le shell du conteneur qui
      # doit lire la variable, pas docker au moment du parsing.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 5s
      retries: 5
      # start_interval : pendant start_period, docker sonde a cette cadence au
      # lieu d'attendre `interval`. C'est ce qui fait passer le service a
      # "healthy" des qu'il l'est, au lieu de faire patienter install.sh
      # jusqu'au prochain intervalle. Docker >= 25.
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    # Aucun port publie : la base n'est joignable que par le reseau interne.

  minio:
    # Tag fige, et fige a cette release precisement : les images communautaires
    # posterieures a mai 2025 ont retire la console web. Un `latest` ferait
    # disparaitre l'interface d'administration du jour au lendemain, sans qu'une
    # seule ligne du depot ait change.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    init: true
    command: server /data --console-address ":9001"
    environment:
      # Identifiants d'administration du serveur. Le prefixe dit qui les lit :
      # MINIO_* n'est passe qu'a minio et minio-init, jamais au backend.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD dans .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    # Aucun port publie : la machine est PARTAGEE. Une console MinIO ouverte,
    # ce sont toutes les pieces des clients de l'avocat. Seul
    # docker-compose.dev.yml publie, sur 127.0.0.1.

  # Provisionne le stockage (bucket, policy, utilisateur restreint) puis sort.
  # Le detail et sa justification sont dans minio/provision.sh.
  #
  # `restart: "no"` est indispensable : la valeur par defaut relancerait en
  # boucle un conteneur qui a reussi.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD dans .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?definir STORAGE_BUCKET dans .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?definir STORAGE_ACCESS_KEY dans .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?definir STORAGE_SECRET_KEY dans .env}
    volumes:
      - ./minio:/infra:ro
    entrypoint: ['/bin/bash', '/infra/provision.sh']
    restart: 'no'

  backend:
    # Aucune section `build` : ce fichier ne sait que TIRER. C'est ce qui rend
    # infra/ deployable seul, sans une ligne de code source sur la machine.
    # Pour construire en local (verifier ce fichier avant de publier), il y a
    # le calque docker-compose.build.yml — `./install.sh --from-source`.
    #
    # IMAGE_TAG a son defaut ICI et pas dans .env : la version appartient au
    # code, pas a la machine. Dans .env, install.sh ne la reecrirait jamais
    # (set_env_default ne remplit que le vide) et une machine resterait epinglee
    # a une version perimee sans que rien ne le signale. La surcharger reste
    # possible, et c'est le rollback : IMAGE_TAG=0.1.0 docker compose ... up -d (la version d avant l authentification)
    image: ghcr.io/sephorah/exo2-portail-depot-backend:${IMAGE_TAG:-0.2.0}
    init: true
    environment:
      NODE_ENV: production
      PORT: ${PORT:?definir PORT dans .env}
      API_PREFIX: ${API_PREFIX:?definir API_PREFIX dans .env}
      # Surcharge deliberee du 127.0.0.1 de .env : ici le reseau du conteneur
      # est isole et aucun port n'est publie, donc 0.0.0.0 n'expose rien — mais
      # c'est necessaire pour que nginx joigne le service par le reseau interne.
      BIND_ADDRESS: 0.0.0.0
      # Origine a partir de laquelle l'API compose le lien client
      # (<origine>/depot/<jeton>). Elle vient de .env telle quelle, et NON d'un
      # en-tete de la requete : l'en-tete Host est fourni par le client, donc un
      # appel forge ferait renvoyer un lien vers le domaine d'un attaquant — que
      # l'avocat collerait ensuite dans un courriel a son client.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL dans .env}
      # Seuls l'hote et le port different entre la machine et le conteneur :
      # .env vise 127.0.0.1:21632 pour `pnpm dev`, ici c'est le nom du service
      # sur le reseau interne. Le reste (utilisateur, mot de passe, base) vient
      # de .env tel quel, et l'URL est assemblee par l'application avec
      # encodeURIComponent — plus aucune concatenation ici, donc plus aucun mot
      # de passe capable de produire une URL invalide.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?definir DB_USER dans .env}
      DB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      DB_NAME: ${DB_NAME:?definir DB_NAME dans .env}
      # Meme logique que DB_HOST : .env vise le MinIO de `pnpm dev` sur
      # 127.0.0.1:21690, ici c'est le nom du service sur le reseau interne.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:?definir STORAGE_REGION dans .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?definir STORAGE_BUCKET dans .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?definir STORAGE_ACCESS_KEY dans .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?definir STORAGE_SECRET_KEY dans .env}
      # Lues par l'authentification avocat (B1). Passees des maintenant : elles
      # etaient documentees et generees par install.sh, mais n'atteignaient pas
      # le conteneur — l'oubli ne se serait vu qu'a la premiere connexion.
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      JWT_EXPIRES: ${JWT_EXPIRES:?definir JWT_EXPIRES dans .env}
      # Duree de la session et inactivite toleree. La seconde doit rester
      # inferieure a la premiere, sinon elle ne s'applique jamais : l'API le
      # verifie au demarrage.
      SESSION_EXPIRES: ${SESSION_EXPIRES:?definir SESSION_EXPIRES dans .env}
      SESSION_IDLE_EXPIRES: ${SESSION_IDLE_EXPIRES:?definir SESSION_IDLE_EXPIRES dans .env}
      # Compte de demonstration, lu par `node dist/seed.js` — qu'install.sh
      # execute dans CE conteneur apres les healthchecks. C'est la raison pour
      # laquelle les trois variables sont passees au backend et pas ailleurs :
      # le seed n'a pas de conteneur a lui.
      SEED_LAWYER_EMAIL: ${SEED_LAWYER_EMAIL:?definir SEED_LAWYER_EMAIL dans .env}
      SEED_LAWYER_NAME: ${SEED_LAWYER_NAME:?definir SEED_LAWYER_NAME dans .env}
      SEED_LAWYER_PASSWORD: ${SEED_LAWYER_PASSWORD:?definir SEED_LAWYER_PASSWORD dans .env}
    depends_on:
      db:
        # Postgres accepte les connexions plusieurs secondes apres que son
        # conteneur est « demarre ». Sans cette condition, `migrate deploy`
        # echoue au premier boot et l'API redemarre en boucle jusqu'a ce que
        # ca passe — un demarrage qui finit par marcher n'est pas un
        # demarrage qui marche.
        condition: service_healthy
      minio:
        # assertBucketExists() tourne dans onModuleInit : un MinIO pas encore
        # pret ferait echouer le demarrage de l'API, pas seulement le premier
        # upload.
        condition: service_healthy
      minio-init:
        # Le bucket et l'utilisateur restreint doivent exister AVANT que l'API
        # tente de s'authentifier avec ce dernier.
        condition: service_completed_successfully
    healthcheck:
      # L'image n'a ni curl ni wget ; node 22 fournit fetch nativement.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:21610/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    # Aucun port publie : seul le proxy joint les services, par le reseau interne.

  frontend:
    # Meme tag que le backend, et c'est voulu : les deux images sont publiees
    # par le meme run, depuis le meme commit. Un tag par image permettrait de
    # deployer un front et une API issus de commits differents.
    image: ghcr.io/sephorah/exo2-portail-depot-frontend:${IMAGE_TAG:-0.2.0}
    init: true
    healthcheck:
      # Meme technique que le backend : l'image n'a ni curl ni wget, node 22
      # fournit fetch. Sans ce healthcheck, install.sh ne pourrait pas attendre
      # autre chose que « le conteneur est lance », ce qui ne prouve rien.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      # 127.0.0.1 explicitement : la machine de staging est PARTAGEE avec
      # d'autres candidats, et un bind sur 0.0.0.0 exposerait tout le portail
      # — base comprise, via /api — a qui scanne la machine. 21600 est le port
      # attribue vers lequel le proxy de la machine relaie le trafic HTTP
      # (443 arrive en passthrough TLS sur 21601, cf. A7).
      #
      # Consequence en local : le portail est sur http://127.0.0.1:21600, plus
      # sur :8080.
      - '127.0.0.1:21600:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Hors de conf.d/ deliberement : la conf principale de l'image charge
      # conf.d/*.conf au niveau `http`, ou un `location` nu est une erreur de
      # syntaxe. Ce fragment est inclus DANS le bloc server.
      - ./nginx/portal-locations.conf:/etc/nginx/portal-locations.conf:ro
      # Racine du challenge ACME. Presente meme sans TLS : c'est par cette pile
      # en clair que passe l'AMORCAGE du certificat (nginx ne demarre pas si le
      # fichier de certificat manque, cf. nginx.conf). Vide, le `location`
      # repond simplement 404.
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      # busybox wget est present dans nginx:alpine. Le proxy en bonne sante est
      # la seule chose qui prouve que le portail repond a l'exterieur : c'est
      # sur lui qu'install.sh conclut.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      # Forme longue : « proxy demarre » doit vouloir dire « ce qu'il sert
      # repond », sinon la premiere requete tombe sur un 502.
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  # Partage entre nginx (lecture) et certbot (ecriture), declare ici et pas
  # seulement dans le calque TLS : c'est ce compose-ci qui tourne pendant
  # l'amorcage du certificat, et sans le volume la racine du challenge
  # n'existerait pas.
  certbot_www:
  # Volume distinct de minio_data_dev, comme pgdata l'est de pgdata_dev : un
  # nettoyage de developpement ne doit pas pouvoir atteindre les pieces reelles.
  minio_data:
