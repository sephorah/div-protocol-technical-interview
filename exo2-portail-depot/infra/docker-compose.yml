# La pile de production. Elle TIRE, elle ne construit pas — voir
# docs/exploitation.md § Les images et le registre.
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#
# Les deux drapeaux sont necessaires, depuis la RACINE du depot : compose deduit
# son repertoire de projet du dossier du premier `-f`, donc infra/ ici, alors que
# .env vit a la racine. Les chemins relatifs de ce fichier sont donc relatifs a
# infra/. Detail dans docs/exploitation.md § Les commandes compose.
#
# `name:` fige : sans lui le projet s'appellerait « infra » et tous les volumes
# existants deviendraient orphelins. Distinct de celui du fichier dev, sans quoi
# `pnpm db:up` recreerait les services de production avec la config de dev.
name: exo2-portail-depot

services:
  db:
    image: postgres:17-alpine
    init: true
    # La forme `:?` fait echouer `up` en nommant la variable manquante. Sans
    # elle, une variable vide demarrerait un Postgres sans mot de passe.
    environment:
      POSTGRES_USER: ${DB_USER:?definir DB_USER dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      POSTGRES_DB: ${DB_NAME:?definir DB_NAME dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` echappe l'interpolation compose : c'est le shell du conteneur qui
      # doit lire la variable.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 5s
      retries: 5
      # start_interval : pendant start_period, docker sonde a cette cadence au
      # lieu d'attendre `interval`. C'est ce sur quoi install.sh bloque.
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  minio:
    # Tag fige a cette release precisement : les images posterieures a mai 2025
    # ont retire la console web.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    init: true
    command: server /data --console-address ":9001"
    environment:
      # Le prefixe dit qui lit la variable : MINIO_* n'est passe qu'a minio et
      # minio-init, jamais au backend.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD dans .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # Provisionne le stockage puis sort. `restart: "no"` est indispensable : le
  # defaut relancerait en boucle un conteneur qui a reussi.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD dans .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?definir STORAGE_BUCKET dans .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?definir STORAGE_ACCESS_KEY dans .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?definir STORAGE_SECRET_KEY dans .env}
    volumes:
      - ./minio:/infra:ro
    entrypoint: ['/bin/bash', '/infra/provision.sh']
    restart: 'no'

  backend:
    # IMAGE_TAG a son defaut ICI et pas dans .env : la version appartient au
    # code. Lire docs/exploitation.md avant tout retour arriere — chaque version
    # anterieure retire quelque chose en silence.
    image: ghcr.io/sephorah/exo2-portail-depot-backend:${IMAGE_TAG:-0.4.1}
    init: true
    environment:
      NODE_ENV: production
      PORT: ${PORT:?definir PORT dans .env}
      API_PREFIX: ${API_PREFIX:?definir API_PREFIX dans .env}
      # Surcharge deliberee du 127.0.0.1 de .env : le reseau du conteneur est
      # isole et aucun port n'est publie, mais nginx doit joindre le service.
      BIND_ADDRESS: 0.0.0.0
      # Origine du lien client, prise dans .env et JAMAIS d'un en-tete de la
      # requete : Host est fourni par le client, donc un appel forge ferait
      # renvoyer un lien vers le domaine d'un attaquant.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL dans .env}
      # Seuls l'hote et le port different entre la machine et le conteneur ; le
      # reste vient de .env tel quel et l'URL est assemblee par l'application.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?definir DB_USER dans .env}
      DB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans .env}
      DB_NAME: ${DB_NAME:?definir DB_NAME dans .env}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:?definir STORAGE_REGION dans .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?definir STORAGE_BUCKET dans .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?definir STORAGE_ACCESS_KEY dans .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?definir STORAGE_SECRET_KEY dans .env}
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      # Cle de la session client anonyme, distincte de celle de l'avocat.
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET:?definir CLIENT_JWT_SECRET dans .env}
      JWT_EXPIRES: ${JWT_EXPIRES:?definir JWT_EXPIRES dans .env}
      SESSION_EXPIRES: ${SESSION_EXPIRES:?definir SESSION_EXPIRES dans .env}
      SESSION_IDLE_EXPIRES: ${SESSION_IDLE_EXPIRES:?definir SESSION_IDLE_EXPIRES dans .env}
      # Lues par `node dist/seed.js`, qu'install.sh execute dans CE conteneur :
      # le seed n'a pas de conteneur a lui.
      SEED_LAWYER_EMAIL: ${SEED_LAWYER_EMAIL:?definir SEED_LAWYER_EMAIL dans .env}
      SEED_LAWYER_NAME: ${SEED_LAWYER_NAME:?definir SEED_LAWYER_NAME dans .env}
      SEED_LAWYER_PASSWORD: ${SEED_LAWYER_PASSWORD:?definir SEED_LAWYER_PASSWORD dans .env}
    depends_on:
      db:
        # Postgres accepte les connexions plusieurs secondes apres le demarrage
        # de son conteneur : sans cette condition, `migrate deploy` echoue au
        # premier boot et l'API redemarre en boucle.
        condition: service_healthy
      minio:
        # assertBucketExists() tourne dans onModuleInit : un MinIO pas pret fait
        # echouer le DEMARRAGE de l'API, pas seulement le premier upload.
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # L'image n'a ni curl ni wget ; node 22 fournit fetch nativement.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:21610/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  frontend:
    # Meme tag que le backend, et c'est voulu : les deux images sont publiees par
    # le meme run, depuis le meme commit.
    image: ghcr.io/sephorah/exo2-portail-depot-frontend:${IMAGE_TAG:-0.4.1}
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    init: true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Aucune cle `command` : celle de l'image porte deja --config.file et
    # --storage.tsdb.path, et en oublier un ferait demarrer Prometheus sur une
    # configuration vide, sans erreur visible.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  grafana:
    # L'image OSS explicitement : `grafana/grafana` embarque des fonctions
    # Enterprise non licenciees. Tag fige — le format de provisionnement des
    # alertes est ce qui bouge le plus d'une majeure a l'autre.
    image: grafana/grafana-oss:13.0.2
    init: true
    environment:
      # Les deux variables vont ensemble : sans serve_from_sub_path, Grafana
      # genere ses URL a la racine, repond 200 et reste blanc — aucune erreur a
      # lire. L'origine vient de PUBLIC_BASE_URL, qui suit HTTPS.
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL dans .env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD dans .env}
      # Ecrits alors qu'ils sont deja le defaut : les rouvrir doit etre une
      # decision, pas un oubli. La machine est partagee.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Aucun appel sortant, et Grafana 13 en fait trois sortes par defaut :
      # verification de version, statistiques d'usage, et cinq greffons
      # telecharges au demarrage. Voir docs/observabilite.md.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      # Les trois sous-repertoires sont montes UN PAR UN : recouvrir
      # /etc/grafana/provisioning entier ferait disparaitre ceux de l'image, et
      # Grafana journaliserait une erreur de provisionnement a chaque demarrage.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      # Chemin reference par provisioning/dashboards/portail.yml ; les deux se
      # suivent.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # Le chemin porte /grafana/, et c'est ce qui rend la sonde utile : sans
      # serve_from_sub_path, Grafana repond 302 et `curl -fsS` echoue, donc le
      # conteneur devient unhealthy au lieu de servir une page blanche.
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/grafana/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      # 127.0.0.1 explicitement : la machine est PARTAGEE, un bind sur 0.0.0.0
      # exposerait tout le portail, base comprise via /api. 21600 est le port
      # attribue vers lequel la machine relaie le trafic HTTP.
      - '127.0.0.1:21600:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Hors de conf.d/ : ce sont des directives de niveau `server`, et conf.d/
      # est inclus au niveau `http`. log-redact.conf, lui, doit y etre — `map` et
      # `log_format` ne valent qu'au niveau `http`. Voir docs/exploitation.md.
      - ./nginx/portal-locations.conf:/etc/nginx/portal-locations.conf:ro
      - ./nginx/log-redact.conf:/etc/nginx/conf.d/00-log-redact.conf:ro
      # Meme raison : la `map` de mise a niveau WebSocket est de niveau `http`.
      - ./nginx/websocket-upgrade.conf:/etc/nginx/conf.d/00-websocket-upgrade.conf:ro
      - ./nginx/server-hardening.conf:/etc/nginx/server-hardening.conf:ro
      # Racine du challenge ACME, presente meme sans TLS : c'est par la pile en
      # clair que passe l'amorcage du certificat.
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      # Le proxy en bonne sante est la seule chose qui prouve que le portail
      # repond a l'exterieur : c'est sur lui qu'install.sh conclut.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      grafana:
        # service_started et NON service_healthy : nginx resout `grafana` au
        # chargement de sa conf, donc le conteneur doit exister — mais attendre
        # qu'il soit sain retarderait la reponse du PORTAIL pour son tableau de
        # bord, ce qui inverse les priorites.
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  # Partage entre nginx (lecture) et certbot (ecriture), declare ici et pas
  # seulement dans le calque TLS : c'est cette pile-ci qui tourne pendant
  # l'amorcage du certificat.
  certbot_www:
  # Distincts des volumes _dev : un nettoyage de developpement ne doit pas
  # pouvoir atteindre les pieces reelles.
  minio_data:
  prometheus_data:
  # Base interne de Grafana. Le tableau de bord, les alertes et la source de
  # donnees n'y sont PAS : ils sont provisionnes depuis des fichiers, precisement
  # pour survivre a la perte de ce volume.
  grafana_data:
