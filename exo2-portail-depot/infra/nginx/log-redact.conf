# Masquage du jeton de depot dans les journaux d'acces : l'enonce le place dans
# le chemin, et un chemin s'ecrit dans access.log. Voir docs/exploitation.md
# § Le jeton dans l'URL.
#
# Ici et pas dans portal-locations.conf : `map` et `log_format` ne sont valides
# qu'au niveau `http`, et conf.d/*.conf y est inclus. Le prefixe 00- charge ce
# fichier avant default.conf, donc avant l'usage du format.

map $request_uri $redacted_uri {
    default                                    $request_uri;
    # /deposit doit rester identique a DEPOSIT_PATH
    # (backend/src/requests/public-url.ts) : desaligne, ce fichier ne masque
    # plus rien et rien ne le signale. Le prefixe /api/v1 suit API_PREFIX.
    "~^/deposit/[^/?]+(?<deposit_rest>.*)$"      "/deposit/[redacted]$deposit_rest";
    "~^/api/v1/public/[^/?]+(?<api_rest>.*)$"    "/api/v1/public/[redacted]$api_rest";
}

# Le format `combined` de l'image, $request reconstruit autour de l'URI masquee.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Ce fichier definit le format, il ne l'ACTIVE pas : `access_log ... redacted`
# vit dans server-hardening.conf, au niveau `server`.
