# Masquage du jeton de depot dans les journaux d'acces.
#
# L'enonce place le jeton dans le CHEMIN (POST /public/:token/unlock), et un
# chemin s'ecrit dans access.log. Or ce jeton est un laissez-passer : qui le lit
# entre dans le dossier. Sur une machine PARTAGEE avec d'autres candidats,
# l'ecrire en clair sur le disque revient a le publier.
#
# La parade radicale — le jeton apres un `#`, jamais envoye au serveur — a ete
# ecartee : elle imposerait POST /public/unlock avec le jeton dans le corps,
# donc une surface d'API qui s'ecarte de la consigne. Ce masquage est ce qui la
# remplace.
#
# POURQUOI CE FICHIER N'EST PAS DANS portal-locations.conf : `map` et
# `log_format` ne sont valides qu'au niveau `http`, et portal-locations.conf est
# inclus DANS un bloc `server`. conf.d/*.conf, lui, est inclus au niveau `http`.
# Le prefixe 00- garantit le chargement avant default.conf, donc que le format
# existe avant que le serveur ne s'y refere.
#
# Un seul fichier pour les deux serveurs (clair et TLS) : duplique dans
# nginx.conf et nginx-tls.conf, le masquage finirait par ne plus exister que
# dans l'un des deux et le jeton reapparaitrait en HTTPS sans que rien ne le
# signale — exactement la derive que l'extraction de A7 visait a empecher.
#
# Le prefixe /api/v1 est ecrit en dur : nginx ne lit pas l'environnement. Il
# rejoint la liste des fichiers a changer ensemble quand API_PREFIX bouge.

map $request_uri $redacted_uri {
    default                                    $request_uri;
    # Le premier segment apres le prefixe est le jeton ; ce qui suit (une
    # query, /unlock, /files) est conserve, c'est ce qui rend le journal encore
    # lisible.
    # /deposit doit rester identique a DEPOSIT_PATH
    # (backend/src/requests/public-url.ts) : desaligne, ce fichier ne masque
    # plus rien et rien ne le signale.
    "~^/deposit/[^/?]+(?<deposit_rest>.*)$"      "/deposit/[redacted]$deposit_rest";
    "~^/api/v1/public/[^/?]+(?<api_rest>.*)$"    "/api/v1/public/[redacted]$api_rest";
}

# Le format `combined` de l'image, a ceci pres que $request (methode + URI +
# version) est reconstruit autour de l'URI masquee. Tout le reste — code,
# taille, duree, adresse, user-agent — est conserve : on garde la tracabilite,
# on retire le secret.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Ce fichier definit le format, il ne l'ACTIVE pas : `access_log ... redacted`
# vit dans server-hardening.conf, au niveau `server`. L'activer ici serait un
# piege — nginx CUMULE les `access_log` d'un meme niveau, et l'image en declare
# deja un au niveau `http`, donc chaque requete produirait la ligne masquee ET
# la ligne en clair. Le raisonnement complet est dans server-hardening.conf.
