# Grafana Live ouvre un WebSocket sur /grafana/api/live/ws. Sans les trois
# directives de portal-locations.conf que cette map alimente, nginx relaie en
# HTTP/1.0 et le handshake repond 400 : le navigateur reconnecte en boucle,
# sans qu'aucune page ne casse ni qu'aucun journal serveur ne le dise.
#
# Ici et pas dans portal-locations.conf : `map` n'est valide qu'au niveau
# `http`, et conf.d/*.conf y est inclus. Voir docs/exploitation.md § nginx.

# `close` et non "" pour une requete ordinaire : la meme location sert les
# reponses HTTP normales de Grafana, qui ne doivent pas annoncer une mise a
# niveau que personne n'a demandee.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
