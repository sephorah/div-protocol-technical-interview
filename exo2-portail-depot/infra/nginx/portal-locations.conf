# Les `location` du portail, sans `server` : ce fichier est inclus DANS un bloc
# server, par la conf en clair et par celle en TLS. Voir docs/exploitation.md
# § Le reverse proxy.
#
# Monte hors de conf.d/ : ce repertoire est inclus au niveau `http`, ou un
# `location` nu est une erreur de syntaxe.

location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Correspondance exacte : nginx l'evalue avant les prefixes. Le chemin doit
# suivre API_PREFIX — desynchronise, il ne casse rien de visible, il rend
# simplement la sonde publique.
location = /api/v1/health {
    access_log off;
    deny all;
}

location = /api/v1/metrics {
    access_log off;
    deny all;
}

# PAS de barre finale : Grafana tourne avec serve_from_sub_path=true et
# redirigerait en boucle. Les add_header ci-dessous annulent ceux herites de
# server-hardening.conf — c'est voulu (Grafana a besoin de 'unsafe-inline'), et
# c'est pourquoi les deux en-tetes anti-fuite y sont repetes.
location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

# Le prefixe et le port sont ecrits en dur : nginx ne lit pas l'environnement.
location /api/ {
    # PAS de barre finale : Nest sert lui-meme sous /api/v1, une barre finale
    # retirerait le prefixe et tout repondrait 404.
    proxy_pass http://backend:21610;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Borne aussi ce qu'un client anonyme peut faire bufferiser au proxy.
    client_max_body_size 25m;
}
