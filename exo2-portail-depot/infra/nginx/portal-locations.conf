# Les regles de routage du portail, et elles seules : ni `server`, ni `listen`,
# ni `server_name`. Ce fichier est inclus DANS un bloc `server` — par celui en
# clair de nginx.conf, et par celui en TLS de nginx-tls.conf (A7).
#
# Il est monte hors de conf.d/, sur /etc/nginx/portal-locations.conf : la
# configuration principale de l'image charge conf.d/*.conf au niveau `http`, ou
# un `location` nu est une erreur de syntaxe. Le poser la ferait echouer nginx
# au demarrage.
#
# L'extraction n'est pas cosmetique : dupliquee entre les deux confs, la regle
# `deny all` de la sonde de sante finirait par ne plus exister que dans une des
# deux, et la sonde redeviendrait publique en HTTPS sans que rien ne le signale.

# Les en-tetes de securite et le journal masque ne sont PAS ici : ils vivent
# dans server-hardening.conf, que les TROIS blocs server incluent — celui-ci
# n'est inclus que par les deux qui routent, or le bloc du port 80 du calque
# TLS (redirection + ACME) doit les porter aussi.

# Le fallback SPA est gere par `serve -s` dans le conteneur frontend :
# inutile de le refaire ici.
location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# La sonde de sante n'a aucune raison d'etre publique : elle publierait
# l'etat de la base a qui la scanne, ce qui indique quand frapper. Ses deux
# consommateurs sont sur le reseau interne — le `healthcheck` docker du
# backend, qui tape 127.0.0.1:21610/api/v1/health dans son propre
# conteneur, et plus tard Prometheus (F1). Pour la consulter a la main :
#   docker compose -f infra/docker-compose.yml --env-file .env exec backend \
#     node -e "fetch('http://127.0.0.1:21610/api/v1/health').then(r=>r.text()).then(console.log)"
#
# `= /api/v1/health` : correspondance exacte, evaluee avant les prefixes.
# Ce chemin doit suivre API_PREFIX : le desynchroniser ne casse rien de
# visible, il rend simplement la sonde publique a nouveau.
location = /api/v1/health {
    access_log off;
    deny all;
}

# Meme raisonnement, meme forme : publie, /metrics dit a qui scanne combien de
# demandes existent, quand les depots ont lieu, combien de PIN ont ete refuses
# et quelle dependance est en panne. Son seul consommateur est Prometheus, sur
# le reseau interne, qui ne passe pas par ce proxy.
#
# `access_log off` : le scrape a lieu toutes les 15 secondes, il noierait le
# journal sans jamais rien apprendre a personne.
location = /api/v1/metrics {
    access_log off;
    deny all;
}

# Grafana (F2). C'est le SEUL chemin d'acces : le service ne publie aucun port,
# parce que la machine est partagee avec d'autres candidats et qu'il s'agit
# d'une interface d'administration. Ce qui protege l'acces est le mot de passe
# admin genere par install.sh, pas l'obscurite de ce chemin.
#
# PAS de barre finale sur proxy_pass : Grafana tourne avec
# serve_from_sub_path=true, il attend donc de recevoir /grafana/... intact. Une
# barre finale retirerait le prefixe et Grafana redirigerait aussitot vers
# /grafana/, en boucle.
#
# Pas d'en-tetes Upgrade/Connection : ils demanderaient une `map` au niveau
# `http` (pour $connection_upgrade), qui ne peut pas vivre dans ce fragment
# inclus dans un bloc `server`. Ce qui s'en trouve prive est Grafana Live, le
# flux temps reel des panneaux en streaming — le tableau de bord du portail
# n'en utilise aucun, il se rafraichit par requetes toutes les 30 s.
#
# LA CSP DU PORTAIL NE PEUT PAS S'APPLIQUER ICI, et il faut le dire au lieu de
# le decouvrir : Grafana amorce son interface par un <script> INLINE dans son
# index.html, et evalue du code a l'execution. Sous
# `default-src 'self'` (donc script-src 'self'), ce script est bloque et
# l'interface reste une page blanche — sans erreur cote serveur, seulement une
# violation dans la console du navigateur.
#
# Les `add_header` ci-dessous annulent donc TOUS ceux herites de
# server-hardening.conf : c'est le piege que ce fichier documente, et c'est ici
# le comportement recherche. Les deux en-tetes de fuite sont pour cette raison
# REPETES a l'identique — les omettre les supprimerait sans rien signaler.
# `access_log` n'est pas concerne : ce n'est pas un add_header, le journal
# masque reste herite.
#
# Ce que cette politique-ci vaut, honnetement : plus faible que celle du portail
# ('unsafe-inline' et 'unsafe-eval' sur les scripts). Ce qui la borne est le
# perimetre — /grafana/ est derriere un mot de passe, ne sert aucune piece de
# client et ne voit passer aucun jeton de depot.
location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

# Le prefixe et le port sont ecrits en dur ici : nginx ne lit pas
# l'environnement. Ils doivent rester alignes sur API_PREFIX et PORT
# du .env — voir la note en tete de infra/docker-compose.yml.
location /api/ {
    # PAS de barre finale : le backend sert lui-meme sous /api/v1
    # (app.setGlobalPrefix), donc le chemin doit lui parvenir intact. Une
    # barre finale ici retirerait le /api et tout repondrait 404.
    proxy_pass http://backend:21610;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Depot de pieces : laisser passer des fichiers volumineux.
    client_max_body_size 25m;
}
