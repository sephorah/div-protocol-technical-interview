# Les regles de routage du portail, et elles seules : ni `server`, ni `listen`,
# ni `server_name`. Ce fichier est inclus DANS un bloc `server` — par celui en
# clair de nginx.conf, et par celui en TLS de nginx-tls.conf (A7).
#
# Il est monte hors de conf.d/, sur /etc/nginx/portal-locations.conf : la
# configuration principale de l'image charge conf.d/*.conf au niveau `http`, ou
# un `location` nu est une erreur de syntaxe. Le poser la ferait echouer nginx
# au demarrage.
#
# L'extraction n'est pas cosmetique : dupliquee entre les deux confs, la regle
# `deny all` de la sonde de sante finirait par ne plus exister que dans une des
# deux, et la sonde redeviendrait publique en HTTPS sans que rien ne le signale.

# Le jeton de depot voyage dans l'URL, l'enonce le placant dans le chemin. Deux
# fuites en decoulent, et une ligne chacune les ferme :
#
# - Referer : des qu'une page charge une ressource d'un autre domaine (police,
#   image, script), le navigateur transmet a ce domaine l'adresse de la page
#   courante — donc le jeton. C'est le scenario que l'OWASP decrit pour les
#   liens de reinitialisation de mot de passe, de meme forme que le notre.
# - Indexation : le portail est prive de bout en bout, rien n'y a vocation a
#   etre trouve par un moteur de recherche.
#
# PIEGE : un `add_header` place plus tard DANS un `location` annule tous ceux
# herites du niveau au-dessus. Ces deux-la disparaitraient alors sans la
# moindre erreur au demarrage. Un location qui doit ajouter un en-tete doit
# repeter ces deux lignes.
#
# `always` : envoye aussi sur les reponses d'erreur, ou le jeton est tout aussi
# present dans l'URL.
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# Format defini dans conf.d/00-log-redact.conf, ou il DOIT vivre : `log_format`
# n'est valide qu'au niveau `http`. Le jeton y est remplace par [redacted].
access_log /var/log/nginx/access.log redacted;

# Le fallback SPA est gere par `serve -s` dans le conteneur frontend :
# inutile de le refaire ici.
location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# La sonde de sante n'a aucune raison d'etre publique : elle publierait
# l'etat de la base a qui la scanne, ce qui indique quand frapper. Ses deux
# consommateurs sont sur le reseau interne — le `healthcheck` docker du
# backend, qui tape 127.0.0.1:21610/api/v1/health dans son propre
# conteneur, et plus tard Prometheus (F1). Pour la consulter a la main :
#   docker compose -f infra/docker-compose.yml --env-file .env exec backend \
#     node -e "fetch('http://127.0.0.1:21610/api/v1/health').then(r=>r.text()).then(console.log)"
#
# `= /api/v1/health` : correspondance exacte, evaluee avant les prefixes.
# Ce chemin doit suivre API_PREFIX : le desynchroniser ne casse rien de
# visible, il rend simplement la sonde publique a nouveau.
location = /api/v1/health {
    access_log off;
    deny all;
}

# Le prefixe et le port sont ecrits en dur ici : nginx ne lit pas
# l'environnement. Ils doivent rester alignes sur API_PREFIX et PORT
# du .env — voir la note en tete de infra/docker-compose.yml.
location /api/ {
    # PAS de barre finale : le backend sert lui-meme sous /api/v1
    # (app.setGlobalPrefix), donc le chemin doit lui parvenir intact. Une
    # barre finale ici retirerait le /api et tout repondrait 404.
    proxy_pass http://backend:21610;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Depot de pieces : laisser passer des fichiers volumineux.
    client_max_body_size 25m;
}
