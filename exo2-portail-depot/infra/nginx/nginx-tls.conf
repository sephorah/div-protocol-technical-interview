# Variante TLS du reverse proxy, montee PAR-DESSUS nginx.conf par le calque
# docker-compose.tls.yml (A7). Compose fusionne les `volumes` par chemin CIBLE :
# les deux fichiers visent /etc/nginx/conf.d/default.conf, donc celui du calque
# remplace celui de la base — il n'y en a jamais deux charges a la fois.
#
# Ce fichier ne nomme PAS le domaine, et c'est necessaire, pas cosmetique :
# nginx ne lit pas l'environnement, et le mecanisme de templates de l'image
# officielle (/etc/nginx/templates/*.template + envsubst) vit dans les scripts
# /docker-entrypoint.d/, que l'entrypoint n'execute QUE si la commande a lancer
# est `nginx`. Le calque la remplace par un `sh -c` (boucle de rechargement) :
# les scripts sont sautes et un ${DOMAIN} resterait litteral. D'ou la lignee de
# certificat au nom fixe `portail` (certbot --cert-name), et le `server_name _`
# — nous sommes seuls derriere le passthrough SNI de la machine.

# ---------------------------------------------------------------------------
# En clair : le challenge ACME, et rien d'autre.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # AVANT la redirection, et ce n'est pas une question d'ordre d'ecriture :
    # nginx choisit le prefixe le PLUS SPECIFIQUE, donc ce bloc l'emporte sur
    # `location /`. C'est ce qui fait que les RENOUVELLEMENTS fonctionnent —
    # Let's Encrypt sonde toujours en HTTP, et un 301 vers HTTPS lui ferait
    # perdre le jeton.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste bascule en HTTPS. `return` dans un `location` et non dans le
    # `server` : au niveau du serveur il s'appliquerait aussi au challenge.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# TLS. Le 443 de la machine arrive ici en passthrough : c'est nous qui
# terminons, avec notre certificat.
# ---------------------------------------------------------------------------
server {
    # Directive `http2` separee : `listen 443 ssl http2` est deprecie depuis
    # nginx 1.25 et emet un avertissement au demarrage.
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Lignee `portail`, pas le nom de domaine : voir l'en-tete. fullchain (et
    # non cert) parce que les navigateurs ont besoin du certificat
    # intermediaire de Let's Encrypt pour remonter jusqu'a la racine.
    ssl_certificate     /etc/letsencrypt/live/portail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portail/privkey.pem;

    # Profil « intermediate » du generateur Mozilla. Les suites DHE de ce profil
    # sont volontairement absentes : elles exigent un ssl_dhparam, que nginx ne
    # fournit plus par defaut depuis la 1.11, et aucun client de ce portail n'a
    # besoin d'autre chose qu'ECDHE.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # `off` : en TLS 1.3 le client choisit, et le laisser choisir en 1.2 evite
    # d'imposer AES a un mobile qui irait plus vite en ChaCha20.
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Les tickets de session cassent la confidentialite persistante tant que la
    # cle de chiffrement n'est pas tournee, ce que nginx ne fait pas seul.
    ssl_session_tickets off;

    # PAS d'agrafage OCSP : Let's Encrypt a retire les URL OCSP de ses
    # certificats le 7 mai 2025 et eteint ses repondeurs le 6 aout 2025. Un
    # `ssl_stapling on` ne ferait plus qu'ecrire des avertissements a chaque
    # demarrage. La revocation passe desormais par les CRL, cote navigateur,
    # sans configuration serveur.

    # 180 jours, sans includeSubDomains ni preload : le domaine parent
    # appartient a quelqu'un d'autre, l'engagement doit rester le notre seul.
    # `always` pour que l'en-tete accompagne aussi les reponses d'erreur.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Memes regles de routage qu'en clair, au fichier pres : c'est tout l'objet
    # de l'extraction.
    include /etc/nginx/portal-locations.conf;
}
