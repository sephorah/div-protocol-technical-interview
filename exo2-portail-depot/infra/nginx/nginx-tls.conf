# Variante TLS, montee PAR-DESSUS nginx.conf par docker-compose.tls.yml :
# compose fusionne les volumes par chemin cible, les deux confs ne sont jamais
# chargees ensemble. Voir docs/exploitation.md § TLS.
#
# Ce fichier ne nomme pas le domaine : nginx ne lit pas l'environnement, et le
# mecanisme de templates de l'image ne s'execute que si la commande est `nginx`
# — le calque la remplace par un `sh -c`. D'ou la lignee de certificat `portail`.

server {
    listen 80 default_server;
    server_name _;

    # Le port 80 ne route rien, mais il voit passer le jeton : un client qui
    # tape l'adresse sans https:// atterrit ici avant d'etre redirige.
    include /etc/nginx/server-hardening.conf;

    # AVANT la redirection : nginx choisit le prefixe le plus specifique, et
    # c'est ce qui fait marcher les RENOUVELLEMENTS, ACME sondant en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # `return` dans un location et non dans le server : au niveau du serveur il
    # s'appliquerait aussi au challenge.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Directive `http2` separee : `listen 443 ssl http2` est deprecie depuis
    # nginx 1.25 et emet un avertissement au demarrage.
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # fullchain et non cert : les navigateurs ont besoin de l'intermediaire.
    ssl_certificate     /etc/letsencrypt/live/portail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portail/privkey.pem;

    # Profil « intermediate » de Mozilla, sans les suites DHE (elles exigent un
    # ssl_dhparam que nginx ne fournit plus depuis la 1.11).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Les tickets cassent la confidentialite persistante tant que la cle n'est
    # pas tournee, ce que nginx ne fait pas seul.
    ssl_session_tickets off;

    # 180 jours, sans includeSubDomains ni preload : le domaine parent
    # appartient a quelqu'un d'autre.
    add_header Strict-Transport-Security "max-age=15552000" always;

    include /etc/nginx/server-hardening.conf;
    include /etc/nginx/portal-locations.conf;
}
