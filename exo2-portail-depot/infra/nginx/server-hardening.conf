# Ce que TOUT bloc `server` du portail doit porter : les deux en-tetes qui
# empechent le jeton de fuir, et le format de journal qui le masque.
#
# Inclus par les TROIS serveurs — celui en clair (nginx.conf), celui en TLS et
# celui du port 80 du calque TLS (nginx-tls.conf, redirection + challenge ACME).
# Ce dernier est la raison d'etre du fichier : il n'inclut pas
# portal-locations.conf, puisqu'il ne route rien, et il journalisait donc
# `GET /deposit/<jeton>` EN CLAIR avant de rediriger. Un client qui tape
# l'adresse sans `https://`, ou un client de messagerie qui transforme le texte
# en lien http, suffisait a produire la fuite.
#
# ------------------------------------------------------------------
# POURQUOI `access_log` EST ICI, AU NIVEAU `server`, ET PAS AU NIVEAU `http`
# ------------------------------------------------------------------
# nginx CUMULE les `access_log` declares au MEME niveau, il ne les remplace
# pas. L'image stock declare deja `access_log /var/log/nginx/access.log main;`
# au niveau `http`, dans son propre /etc/nginx/nginx.conf — que nous ne montons
# pas et ne pouvons donc pas modifier. Poser le notre a cote produisait DEUX
# lignes par requete : la masquee, et celle en clair. Mesure :
#
#   "GET /deposit/PREUVE-EN-CLAIR-987 HTTP/1.1" 200   <- format `main` de l'image
#   "GET /deposit/[redacted] HTTP/1.1" 200            <- le notre
#
# Au niveau `server`, en revanche, la directive REMPLACE celle heritee du
# niveau http. C'est le seul placement qui supprime reellement la ligne en
# clair, et c'est pour cela qu'il faut la repeter dans chaque serveur — d'ou ce
# fichier plutot qu'une ligne recopiee trois fois.
#
# Le format `redacted` lui-meme est defini dans conf.d/00-log-redact.conf :
# `map` et `log_format` ne sont valides qu'au niveau `http`.
access_log /var/log/nginx/access.log redacted;

# Le jeton de depot voyage dans l'URL, l'enonce le placant dans le chemin. Deux
# fuites en decoulent, et une ligne chacune les ferme :
#
# - Referer : des qu'une page charge une ressource d'un autre domaine (police,
#   image, script), le navigateur transmet a ce domaine l'adresse de la page
#   courante — donc le jeton. C'est le scenario que l'OWASP decrit pour les
#   liens de reinitialisation de mot de passe, de meme forme que le notre.
# - Indexation : le portail est prive de bout en bout, rien n'y a vocation a
#   etre trouve par un moteur de recherche.
#
# PIEGE : un `add_header` place plus tard DANS un `location` annule tous ceux
# herites du niveau au-dessus. Ces deux-la disparaitraient alors sans la
# moindre erreur au demarrage. Un location qui doit ajouter un en-tete doit
# repeter ces deux lignes.
#
# `always` : envoye aussi sur les reponses d'erreur et les redirections, ou le
# jeton est tout aussi present dans l'URL.
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# ------------------------------------------------------------------
# CONTENT-SECURITY-POLICY (G4)
# ------------------------------------------------------------------
# Ce que cet en-tete achete n'est PAS de faire marcher l'application : c'est de
# borner les degats d'une dependance frontend compromise. Le SPA embarque React,
# Chakra et react-router ; sans politique, un paquet verole exfiltre vers
# n'importe quel domaine ce que l'avocat a sous les yeux — jeton de depot
# compris, puisqu'il est dans l'URL. `default-src 'self'` ferme ce canal : fetch,
# XHR, beacon, image ou police vers un autre domaine sont refuses par le
# navigateur.
#
# `default-src 'self'` passe sans rien casser parce que la police est
# auto-hebergee (@fontsource-variable/inter, empaquete par vite) : E1 a mesure 40
# requetes au chargement, toutes sur l'origine. Les directives non ecrites
# ci-dessous (script-src, connect-src, font-src, frame-src) retombent dessus, et
# c'est voulu — les repeter a 'self' ne changerait rien et ferait deux endroits a
# corriger.
#
# Chaque ecart a `default-src` a une raison :
#
# - `style-src ... 'unsafe-inline'` : Chakra v3 injecte ses regles a l'execution.
#   L'alternative propre est un nonce, qui suppose une page rendue par un serveur
#   — ce que ce SPA statique n'est pas. A DIRE PLUTOT QU'A LAISSER CROIRE : cette
#   politique n'est donc PAS stricte cote styles. 'unsafe-inline' autorise tout
#   style inline, donc elle ne couvre pas l'injection de style (surcouche qui
#   deguise un bouton, faux formulaire de PIN). Elle borne l'exfiltration, pas la
#   manipulation visuelle.
# - `img-src ... data:` : vite integre en dur, sous forme d'URI `data:`, tout
#   asset de moins de 4 ko (assetsInlineLimit). Sans cette tolerance, ajouter une
#   petite icone casserait la page apres le build, pas pendant.
# - `object-src 'none'` : les pieces deposees sont servies par l'API, donc sur la
#   MEME origine. Herite de 'self', un fichier depose pourrait etre embarque en
#   document de greffon ; 'none' est plus strict que le repli.
# - `base-uri 'self'` : une balise <base> injectee redirige toutes les URL
#   relatives des scripts sans jamais violer script-src.
# - `form-action 'self'` : sinon un formulaire injecte poste le PIN ailleurs.
# - `frame-ancestors 'none'` : clickjacking sur l'ecran de saisie du PIN. Remplace
#   X-Frame-Options, que les navigateurs actuels ignorent en sa presence.
#
# PAS d'`upgrade-insecure-requests` : la pile de l'evaluateur repond en clair sur
# 127.0.0.1:21600, ou la directive ferait demander en https des ressources que
# rien n'y sert.
#
# Meme piege que ci-dessus : un `add_header` dans un `location` annulerait aussi
# celui-ci, silencieusement — la page continuerait de s'afficher, sans politique.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
