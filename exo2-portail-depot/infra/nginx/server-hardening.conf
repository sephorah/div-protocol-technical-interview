# Ce que TOUT bloc `server` du portail doit porter : les en-tetes qui empechent
# le jeton de fuir, et le journal qui le masque. Inclus par les TROIS serveurs,
# y compris celui du port 80 du calque TLS, qui ne route rien mais voit passer
# le jeton avant de rediriger.
#
# Le raisonnement complet : docs/exploitation.md § Le reverse proxy.

# Au niveau `server` et pas `http` : nginx CUMULE les access_log d'un meme
# niveau, et l'image en declare deja un au niveau http. A cote, chaque requete
# produisait deux lignes — la masquee et celle en clair. Le format `redacted`
# est defini dans conf.d/00-log-redact.conf.
access_log /var/log/nginx/access.log redacted;

# PIEGE : un add_header pose dans un `location` annule tous ceux herites, sans
# la moindre erreur au demarrage. Un location qui ajoute un en-tete doit
# repeter ceux-ci.
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# Ce que la CSP achete n'est pas de faire marcher l'application, c'est de borner
# les degats d'une dependance frontend compromise. 'unsafe-inline' sur les
# styles est impose par Chakra v3 : elle borne donc l'exfiltration, pas la
# manipulation visuelle.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
