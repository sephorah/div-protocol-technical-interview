# Reverse proxy : unique point d'entree public. Frontend et API sont servis
# sur la meme origine, donc pas de CORS a configurer cote Nest.
#
# EN CLAIR, sans TLS. C'est la conf du poste de developpement et de la machine
# de l'evaluateur : sur 127.0.0.1, sans nom de domaine public, Let's Encrypt ne
# peut rien valider. Sur la machine de deploiement, le calque
# docker-compose.tls.yml monte nginx-tls.conf PAR-DESSUS ce fichier (A7).
server {
    listen 80;
    server_name _;

    # Challenge HTTP-01 de Let's Encrypt. Present ici, et pas seulement dans
    # nginx-tls.conf, parce que c'est l'oeuf et la poule : nginx REFUSE de
    # demarrer si ssl_certificate designe un fichier absent, donc on ne peut pas
    # demarrer en TLS pour obtenir le certificat qui permettrait de demarrer en
    # TLS. L'amorcage passe donc par cette conf-ci — pile nominale en clair,
    # certbot ecrit son jeton dans le volume, Let's Encrypt vient le lire ici,
    # puis on redemarre avec le calque.
    #
    # Sans TLS, ce bloc sert un repertoire vide : toute URL sous ce prefixe
    # repond 404, ce qui est sans effet et sans risque.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Les regles de routage vivent dans un fichier a part : le serveur TLS les
    # inclut a l'identique, et une regle dupliquee finirait par diverger.
    include /etc/nginx/portal-locations.conf;
}
