# Reverse proxy en clair : unique point d'entree public, frontend et API sur la
# meme origine, donc pas de CORS. C'est la conf du poste de developpement et de
# la machine de l'evaluateur ; le calque TLS monte nginx-tls.conf par-dessus.
# Voir docs/exploitation.md § Le reverse proxy.
server {
    listen 80;
    server_name _;

    # Present ici et pas seulement dans la conf TLS : nginx refuse de demarrer
    # si ssl_certificate designe un fichier absent, donc le premier certificat
    # s'obtient forcement par la pile en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/server-hardening.conf;
    include /etc/nginx/portal-locations.conf;
}
