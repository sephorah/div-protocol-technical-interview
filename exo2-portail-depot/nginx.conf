# Reverse proxy : unique point d'entree public. Frontend et API sont servis
# sur la meme origine, donc pas de CORS a configurer cote Nest.
server {
    listen 80;
    server_name _;

    # Le fallback SPA est gere par `serve -s` dans le conteneur frontend :
    # inutile de le refaire ici.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La sonde de sante n'a aucune raison d'etre publique : elle publierait
    # l'etat de la base a qui la scanne, ce qui indique quand frapper. Ses deux
    # consommateurs sont sur le reseau interne — le `healthcheck` docker du
    # backend, qui tape 127.0.0.1:3000/health dans son propre conteneur, et
    # plus tard Prometheus (F1). Pour la consulter a la main :
    #   docker compose exec backend node -e "fetch('http://127.0.0.1:3000/health').then(r=>r.text()).then(console.log)"
    #
    # `= /api/health` : correspondance exacte, evaluee avant les prefixes.
    location = /api/health {
        access_log off;
        deny all;
    }

    location /api/ {
        # La barre finale retire le prefixe /api avant de transmettre a Nest.
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Depot de pieces : laisser passer des fichiers volumineux.
        client_max_body_size 25m;
    }
}
