# Reverse proxy : unique point d'entree public. Frontend et API sont servis
# sur la meme origine, donc pas de CORS a configurer cote Nest.
server {
    listen 80;
    server_name _;

    # Le fallback SPA est gere par `serve -s` dans le conteneur frontend :
    # inutile de le refaire ici.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # La barre finale retire le prefixe /api avant de transmettre a Nest.
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Depot de pieces : laisser passer des fichiers volumineux.
        client_max_body_size 25m;
    }
}
