# Production. En dev, on lance directement `pnpm dev` a la racine.
services:
  backend:
    build: ./backend
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    # Aucun port publie : seul le proxy joint les services, par le reseau interne.

  frontend:
    build: ./frontend
    init: true
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
